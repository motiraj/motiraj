<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />
  <rect x="15" y="15" width="470" height="470" rx="30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer Decorative Tech Ring -->
  <circle cx="250" cy="180" r="95" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  
  <!-- Central Icon Graphic: Code Brackets + Graduation Cap -->
  <g transform="translate(250, 165)" filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M -45 -25 L -75 0 L -45 25" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Bracket > -->
    <path d="M 45 -25 L 75 0 L 45 25" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Academic Cap Diamond Top -->
    <polygon points="0,-40 35,-22 0,-4 -35,-22" fill="#3b82f6" opacity="0.9" />
    <!-- Cap Base -->
    <path d="M -18 -12 L -18 8 C -18 18 18 18 18 8 L 18 -12" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- 3BM Monogram Text -->
  <text x="250" y="300" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="34" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">
    3BM
  </text>

  <!-- Typography / Name -->
  <text x="250" y="350" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    MOTI RAJ GAUTAM
  </text>
  
  <text x="250" y="380" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="2.5">
    &lt;ACADEMICIAN &amp; DEV /&gt;
  </text>

  <!-- Bottom Accent Line -->
  <line x1="180" y1="415" x2="320" y2="415" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
